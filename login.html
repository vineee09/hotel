<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form>
            <div class="form-control">
                <label for="login">Login</label>
                <input type="text" id="login" placeholder="Digite seu login"/>
            </div>

            <div class="form-control">
                <label for="login">Email</label>
                <input type="email" id="email" placeholder="Digite seu email"/>
            </div>

            <div class="form-control">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha"/>
            </div>

            <div class="form-control">
                <div class="opcoes">
                    <input type="checkbox" id="lembrar">
                    <label for="lembrar">Lembrar meu login</label>
                </div>

                <div class="form-control">
                    <label>Tipo de acesso: </label>

                    <div class="opcoes">
                        <input type="radio" id="aluno" value="aluno">
                        <label for="aluno">Aluno</label>
                    </div>

                    <div class="opcoes">
                        <input type="radio" id="professor" name="tipo" value="professor">
                        <label for="professor">Professor</label>
                    </div>

                    <div class="form-control">
                        <label for="cidade">Cidade:</label>

                        <select id="cidade">
                            <option value="">Selecione sua cidade</option>
                            <option value="jundiai">Jundiai</option>
                            <option value="sao-paulo">São Paulo</option>
                            <option value="cotia">Cotia</option>
                        </select>

                        <div class="form-control">
                            <button type="submit">Entrar</button>
                        </div>


                    </div>

                </div>

            </div>

            <a href="recu.html">Esqueci a senha</a>

        </form>

    </div>
</body>
</html>
