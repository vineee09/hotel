<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/formulario.css">
</head>

<body>
    <div class="container">
        <h1>Cadastro de aluno</h1>


        <form>

            <div class="form-control">
                <label for="nome">Nome:</label>
                <input type="text" id="nome">
            </div>

            <div class="form-control">
                <label for="email">Email:</label>
                <input type="email" id="email">

            </div>

            <div class="form-control">
                <label for="senha">Senha:</label>
                <input type="password" id="senha">
            </div>

            <div class="form-control">
                <label for="confirmar-senha">Data de nascimento:</label>
                <input type="date" id="data">
            </div>

            <div class="form control">
                <label for="confirmar-senha">Curso:</label>
                <select name="curso" id="curso">
                    <option value="informatica">Selecione</option>
                    <option value="informatica">Informatica</option>
                    <option value="progamacao">Programação</option>
                    <option value="administracao">Administração</option>
                </select>
            </div>

            <div class="form-control">
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
                <button type="reset" class="btn-limpar">Limpar</button>
            </div>

        </form>
        <a href="login.html">Ir para a pagina de Login</a>
    </div>


</body>

</html>
