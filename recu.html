<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" href="./css/recu.css">
</head>

<body>
    <div class="container">
        <a href="login.html" aria-label="Voltar para o login">Voltar</a>
        <h1>Esqueci a senha</h1>

        <form action="senha.html" method="post">
            <div class="form-control">
                <label for="email">E-mail de recuperação</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail"
                    autocomplete="email" required>
            </div>

            <div class="form-control">
                <label for="codigo">Código de recuperação</label>
                <input type="text" id="codigo" name="codigo" placeholder="Digite o código recebido"
                    autocomplete="one-time-code" required>
            </div>

            <div class="form-control">
                <a href="senha.html">Confirmar</a>
            </div>
            
            <a href="recu.html">Reenviar codigo</a>
        
        </form>

    </div>
    
</body>

</html>
